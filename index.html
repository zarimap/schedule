<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科学部 予定管理</title>
    <!-- FullCalendar v6 -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 10px; 
            background-color: #f0f2f5; 
            color: #333; 
        }
        #calendar { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white; 
            padding: 10px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            min-height: 400px; 
        }
        .form-container {
            max-width: 900px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-container h2 { margin-top: 0; font-size: 1.2rem; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #555;
        }
        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .field-box { flex: 1 1 0%; min-width: 0; }
        .range-separator {
            width: 28px;
            flex-shrink: 0;
            font-weight: bold;
            color: #666;
            text-align: center;
            line-height: 42px;
            user-select: none;
        }
        input[type="text"], input[type="date"], input[type="time"] {
            width: 100%;
            height: 42px;
            padding: 0 10px;
            margin: 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background-color: #fff;
            appearance: none;
            -webkit-appearance: none;
        }
        input:disabled {
            background-color: #e9ecef;
            color: #6c757d;
            cursor: not-allowed;
            border-color: #ced4da;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            user-select: none;
        }
        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 0;
        }
        button.submit-btn {
            width: 100%;
            height: 44px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button.submit-btn:active { background-color: #0056b3; }
        
        .header-container {
            max-width: 900px;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 1.5rem; }
        .help-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            width: auto;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 9998;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            width: 90%;
            max-width: 500px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }
        .modal-close-btn {
            position: absolute;
            top: 12px; right: 16px;
            background: none; border: none;
            font-size: 24px; font-weight: bold; color: #888;
            cursor: pointer; width: auto; padding: 0; line-height: 1;
        }
        .modal-content h3 {
            margin-top: 0; font-size: 1.25rem;
            border-bottom: 2px solid #007bff; padding-bottom: 8px;
        }
        .modal-content ul { padding-left: 20px; line-height: 1.6; }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(255, 255, 255, 0.85);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(2px);
        }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #e0e0e0;
            border-top: 5px solid #007bff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 15px; font-size: 16px; font-weight: bold;
            color: #007bff; letter-spacing: 0.5px; text-align: center; padding: 0 20px;
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">処理中…</div>
    </div>

    <div class="header-container">
        <h1>🧪 科学部 予定管理</h1>
        <button class="help-btn" id="openHelpBtn">❓ 使い方</button>
    </div>

    <div id='calendar'></div>

    <div class="form-container">
        <h2>📅 予定を追加する</h2>
        
        <div class="form-group">
            <label for="eventTitle">予定の名前</label>
            <input type="text" id="eventTitle" placeholder="（例：夏合宿、実験A）">
        </div>

        <div class="form-group">
            <label>期間指定</label>
            <div class="form-row">
                <div class="field-box"><input type="date" id="eventStartDate"></div>
                <div class="range-separator">〜</div>
                <div class="field-box"><input type="date" id="eventEndDate"></div>
            </div>
        </div>

        <div class="form-group">
            <div class="checkbox-container">
                <input type="checkbox" id="allDayCheck" checked>
                <label for="allDayCheck" style="margin:0; cursor:pointer;">終日</label>
            </div>
        </div>

        <div class="form-group">
            <label>時間指定</label>
            <div class="form-row">
                <div class="field-box"><input type="time" id="eventStartTime" disabled></div>
                <div class="range-separator">〜</div>
                <div class="field-box"><input type="time" id="eventEndTime" disabled></div>
            </div>
        </div>

        <button class="submit-btn" id="addBtn">カレンダーに追加</button>
    </div>

    <div class="modal-overlay" id="helpModal">
        <div class="modal-content">
            <button class="modal-close-btn" id="closeHelpBtn">&times;</button>
            <h3>📖 予定管理の使い方</h3>
            <ul>
                <li><strong>予定の確認:</strong> カレンダー上で科学部の予定を確認できます。</li>
                <li><strong>予定の追加:</strong> フォームから「予定名」「期間」「時間」を設定して追加します。</li>
                <li><strong>終日・時間設定:</strong> 終日チェックを外すと時間の入力が可能になります。</li>
                <li><strong>予定の削除:</strong> カレンダー上の予定をクリックして削除します。</li>
            </ul>
        </div>
    </div>

    <script>
      const loadingOverlay = document.getElementById('loadingOverlay');
      const loadingText = document.getElementById('loadingText');

      function showLoading(msg = '処理中…') {
        loadingText.textContent = msg;
        loadingOverlay.style.display = 'flex';
      }

      function hideLoading() {
        loadingOverlay.style.display = 'none';
      }

      const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxlFIYrp2JuigWirQ6aGd0SrDjrQOWcZ3KooV5esH-6DqQL-fAtk5tTwi387J6p_fQAQA/exec';

      async function fetchGasApi(options = {}, maxRetries = 3) {
        let attempt = 0;
        
        while (attempt < maxRetries) {
          try {
            attempt++;
            const url = options.url || GAS_WEB_APP_URL;
            const method = options.method || 'GET';
            
            let fetchOptions = {
              method: method,
              redirect: 'follow'
            };

            if (method === 'POST') {
              fetchOptions.body = JSON.stringify(options.body || {});
              fetchOptions.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
            }

            const response = await fetch(url, fetchOptions);
            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
            
            const json = await response.json();
            
            if (json && json.error) {
              alert("エラーが発生しました:\n" + json.error);
              throw new Error(json.error);
            }

            return json;

          } catch (err) {
            console.warn(`通信試行 (${attempt}/${maxRetries}):`, err.message);

            if (attempt < maxRetries) {
              showLoading(`再接続中… (${attempt}/${maxRetries})`);
              await new Promise(res => setTimeout(res, 1500));
            } else {
              showLoading('通信エラーが発生しました');
              await new Promise(res => setTimeout(res, 1000));
              hideLoading();
              return null;
            }
          }
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        const openHelpBtn = document.getElementById('openHelpBtn');
        const closeHelpBtn = document.getElementById('closeHelpBtn');
        const helpModal = document.getElementById('helpModal');

        const allDayCheck = document.getElementById('allDayCheck');
        const eventStartTime = document.getElementById('eventStartTime');
        const eventEndTime = document.getElementById('eventEndTime');
        const eventStartDate = document.getElementById('eventStartDate');
        const eventEndDate = document.getElementById('eventEndDate');

        openHelpBtn.addEventListener('click', () => helpModal.style.display = 'flex');
        closeHelpBtn.addEventListener('click', () => helpModal.style.display = 'none');
        helpModal.addEventListener('click', (e) => {
          if (e.target === helpModal) helpModal.style.display = 'none';
        });

        allDayCheck.addEventListener('change', function() {
          const isAllDay = this.checked;
          eventStartTime.disabled = isAllDay;
          eventEndTime.disabled = isAllDay;
          if (isAllDay) {
            eventStartTime.value = '';
            eventEndTime.value = '';
          }
        });

        eventStartDate.addEventListener('change', function() {
          if (!eventEndDate.value) {
            eventEndDate.value = this.value;
          }
        });

        var calendarEl = document.getElementById('calendar');
        var eventTitleInput = document.getElementById('eventTitle');
        var addBtn = document.getElementById('addBtn');

        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          locale: 'ja',
          headerToolbar: {
            left: 'prev,next',
            center: 'title',
            right: 'today'
          },
          events: async function(fetchInfo, successCallback, failureCallback) {
            try {
              const data = await fetchGasApi();
              if (Array.isArray(data)) {
                const events = data.map(event => ({
                  id: event.id,
                  title: event.title,
                  start: event.start,
                  end: event.end || null,
                  allDay: (event.all_day !== undefined) ? event.all_day : (event.allDay !== undefined ? event.allDay : true)
                }));
                successCallback(events);
              } else {
                successCallback([]);
              }
            } catch (err) {
              failureCallback(err);
            } finally {
              hideLoading();
            }
          },
          eventClick: async function(info) {
            if (confirm('「' + info.event.title + '」を削除しますか？')) {
              showLoading('削除中…');
              try {
                await fetchGasApi({
                  method: 'POST',
                  body: { action: 'delete', id: info.event.id }
                });

                info.event.remove();
              } catch (err) {
                console.error('削除失敗:', err);
              } finally {
                hideLoading();
              }
            }
          }
        });

        calendar.render();

        addBtn.addEventListener('click', async function() {
          var title = eventTitleInput.value.trim();
          var startDate = eventStartDate.value;
          var endDate = eventEndDate.value || startDate;
          var isAllDay = allDayCheck.checked;
          var startTime = eventStartTime.value;
          var endTime = eventEndTime.value;

          if (!title || !startDate) {
            alert('予定の名前と開始日を入力してください');
            return;
          }

          let startIso = '';
          let endIso = '';

          if (isAllDay) {
            startIso = startDate;
            let endD = new Date(endDate);
            endD.setDate(endD.getDate() + 1);
            endIso = endD.toISOString().split('T')[0];
          } else {
            if (!startTime) {
              alert('開始時間を入力してください');
              return;
            }
            startIso = `${startDate}T${startTime}:00`;
            if (endTime) {
              endIso = `${endDate}T${endTime}:00`;
            } else {
              endIso = `${endDate}T${startTime}:00`;
            }
          }

          showLoading('追加中…');
          try {
            const res = await fetchGasApi({
              method: 'POST',
              body: {
                action: 'insert',
                data: [{
                  title: title, 
                  start: startIso, 
                  end: endIso, 
                  all_day: isAllDay
                }]
              }
            });

            if (res) {
              eventTitleInput.value = '';
              eventStartDate.value = '';
              eventEndDate.value = '';
              eventStartTime.value = '';
              eventEndTime.value = '';
              allDayCheck.checked = true;
              eventStartTime.disabled = true;
              eventEndTime.disabled = true;

              calendar.refetchEvents();
            }

          } catch (err) {
            console.error('追加失敗:', err);
          } finally {
            hideLoading();
          }
        });
      });
    </script>
</body>
</html>
