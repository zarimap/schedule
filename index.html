<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset='utf-8' />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科学部 予定管理</title>
    <!-- FullCalendar v6 -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 10px; 
            background-color: #f0f2f5; 
            color: #333; 
        }
        #calendar { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white; 
            padding: 10px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            min-height: 400px; 
        }
        
        .form-container {
            max-width: 900px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .form-container h2 { margin-top: 0; font-size: 1.2rem; }
        input[type="text"], input[type="date"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:active { background-color: #0056b3; }
        
        /* ヘッダーエリアのスタイル */
        .header-container {
            max-width: 900px;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { 
            margin: 0; 
            font-size: 1.5rem; 
        }
        .help-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            width: auto;
        }
        .help-btn:hover {
            background-color: #5a6268;
        }

        /* 使い方モーダル（画面中央表示）のスタイル */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 9998;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            width: 90%;
            max-width: 500px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            box-sizing: border-box;
            animation: modalFadeIn 0.2s ease-out;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            width: auto;
            padding: 0;
            line-height: 1;
        }
        .modal-close-btn:hover {
            color: #333;
        }
        .modal-content h3 {
            margin-top: 0;
            font-size: 1.25rem;
            border-bottom: 2px solid #007bff;
            padding-bottom: 8px;
        }
        .modal-content ul {
            padding-left: 20px;
            line-height: 1.6;
        }
        .modal-content li {
            margin-bottom: 8px;
        }

        /* 🔄 全面ローディングオーバーレイのスタイル */
        .loading-overlay {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(2px);
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e0e0e0;
            border-top: 5px solid #007bff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #007bff;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- 🔄 ローディング画面 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Loading…</div>
    </div>

    <!-- ヘッダーエリア -->
    <div class="header-container">
        <h1>🧪 科学部 予定管理</h1>
        <button class="help-btn" id="openHelpBtn">❓ 使い方</button>
    </div>

    <div id='calendar'></div>

    <div class="form-container">
        <h2>📅 予定を追加する</h2>
        <input type="text" id="eventTitle" placeholder="予定の名前（例：実験A）">
        <input type="date" id="eventDate">
        <button id="addBtn">カレンダーに追加</button>
    </div>

    <!-- 使い方モーダル -->
    <div class="modal-overlay" id="helpModal">
        <div class="modal-content">
            <button class="modal-close-btn" id="closeHelpBtn">&times;</button>
            <h3>📖 予定管理の使い方</h3>
            <ul>
                <li><strong>予定の確認:</strong> カレンダー上で科学部の予定を確認できます。</li>
                <li><strong>予定の追加:</strong> カレンダー下のフォームに「予定の名前」と「日付」を入力し、「カレンダーに追加」を押します。</li>
                <li><strong>予定の削除:</strong> カレンダー上の予定をクリック（タップ）すると削除できます。</li>
            </ul>
        </div>
    </div>

    <script>
      // ==========================================
      // 0. ローディング制御関数
      // ==========================================
      const loadingOverlay = document.getElementById('loadingOverlay');
      const loadingText = document.getElementById('loadingText');

      function showLoading(msg = 'Loading…') {
        loadingText.textContent = msg;
        loadingOverlay.style.display = 'flex';
      }

      function hideLoading() {
        loadingOverlay.style.display = 'none';
      }

      // ==========================================
      // 1. GAS 通信ラッパー関数
      // ==========================================
      const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxlFIYrp2JuigWirQ6aGd0SrDjrQOWcZ3KooV5esH-6DqQL-fAtk5tTwi387J6p_fQAQA/exec';

      async function callGasApi(options = {}) {
        const url = options.url || GAS_WEB_APP_URL;
        const method = options.method || 'GET';
        
        let fetchOptions = {
          method: method,
          redirect: 'follow'
        };

        if (method === 'POST') {
          fetchOptions.body = JSON.stringify(options.body || {});
          fetchOptions.headers = {
            'Content-Type': 'text/plain;charset=utf-8'
          };
        }

        const response = await fetch(url, fetchOptions);
        if (!response.ok) {
          throw new Error(`HTTP Error Status: ${response.status}`);
        }
        
        return await response.json();
      }

      // ==========================================
      // 2. モーダル表示制御
      // ==========================================
      document.addEventListener('DOMContentLoaded', function() {
        const openHelpBtn = document.getElementById('openHelpBtn');
        const closeHelpBtn = document.getElementById('closeHelpBtn');
        const helpModal = document.getElementById('helpModal');

        openHelpBtn.addEventListener('click', function() {
          helpModal.style.display = 'flex';
        });

        closeHelpBtn.addEventListener('click', function() {
          helpModal.style.display = 'none';
        });

        helpModal.addEventListener('click', function(e) {
          if (e.target === helpModal) {
            helpModal.style.display = 'none';
          }
        });

        // ==========================================
        // 3. カレンダー & CRUD処理
        // ==========================================
        var calendarEl = document.getElementById('calendar');
        var eventTitleInput = document.getElementById('eventTitle');
        var eventDateInput = document.getElementById('eventDate');
        var addBtn = document.getElementById('addBtn');

        var calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          locale: 'ja',
          headerToolbar: {
            left: 'prev,next',
            center: 'title',
            right: 'today'
          },
          events: async function(fetchInfo, successCallback, failureCallback) {
            showLoading('Loading…');
            try {
              const data = await callGasApi();

              if (data.error) {
                throw new Error(data.error);
              }

              if (!Array.isArray(data)) {
                throw new Error('受領したデータが配列形式ではありません');
              }

              const events = data.map(event => ({
                id: event.id,
                title: event.title,
                start: event.start,
                allDay: event.all_day
              }));

              successCallback(events);
            } catch (err) {
              console.error('取得エラー:', err.message);
              alert('予定の取得に失敗しました');
              successCallback([]);
            } finally {
              hideLoading();
            }
          },
          eventClick: async function(info) {
            if (confirm('「' + info.event.title + '」を削除しますか？')) {
              showLoading('削除中…');
              try {
                const result = await callGasApi({
                  method: 'POST',
                  body: { action: 'delete', id: info.event.id }
                });

                if (result.error) throw new Error(result.error);

                info.event.remove();
                alert('削除しました！');
              } catch (err) {
                console.error('削除失敗:', err.message);
                alert('削除に失敗しました');
              } finally {
                hideLoading();
              }
            }
          }
        });

        calendar.render();

        addBtn.addEventListener('click', async function() {
          var title = eventTitleInput.value;
          var date = eventDateInput.value;

          if (title && date) {
            showLoading('追加中…');
            try {
              const data = await callGasApi({
                method: 'POST',
                body: {
                  action: 'insert',
                  data: [{ title: title, start: date, all_day: true }]
                }
              });

              if (data.error) throw new Error(data.error);

              // 既存の手動追加(addEvent)を廃止し、DB再取得(refetchEvents)に統一して重複を防止
              calendar.refetchEvents();

              eventTitleInput.value = '';
              eventDateInput.value = '';
              alert('追加しました！');
            } catch (err) {
              console.error('追加失敗:', err.message);
              alert('追加に失敗しました');
            } finally {
              hideLoading();
            }
          } else {
            alert('タイトルと日付を入力してください');
          }
        });
      });
    </script>
</body>
</html>
